name: Daily AI Horoscope

on:
  schedule:
    - cron: '0 23 * * *'  # 08:00 KST
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, NOT the default shallow depth-1 clone.
          # The last step mirrors main to GitHub with `git push --force`. A
          # shallow clone can only supply the tip commit, so the push succeeds
          # only while GitHub already has its parent. The moment GitHub falls
          # two or more commits behind, every push fails with
          #   remote: fatal: did not receive expected object <sha>
          #   error: remote unpack failed: index-pack failed
          # and the gap widens by one commit a day — it never self-heals.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai httpx

      - name: Generate horoscope
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate.py

      - name: Save to Bot Manager DB
        env:
          BOT_URL: ${{ secrets.BOT_MANAGER_URL }}
          BOT_API_KEY: ${{ secrets.BOT_MANAGER_API_KEY }}
        run: |
          # Never use `curl -sf` here: -f discards the HTTP status code, which is
          # how a broken Bot Manager went unnoticed for 47 days (2026-06-25 ~ 08-10).
          # Always print the status code and body.
          call() {
            : > /tmp/body.txt   # curl leaves it untouched when it cannot connect
            curl -sS -m 20 -o /tmp/body.txt -w '%{http_code}' \
              -H "X-API-Key: $BOT_API_KEY" "$@" 2>/tmp/curl.err || true
          }

          CODE=$(call "$BOT_URL/api/status")
          if [ "$CODE" != "200" ]; then
            echo "::warning::Bot Manager /api/status -> HTTP $CODE (000 = connection failed)"
            echo "curl: $(cat /tmp/curl.err)"
            echo "body: $(head -c 300 /tmp/body.txt)"
            echo "Skipping DB save"
            exit 0
          fi

          # Save horoscope to bot manager DB (no tweet posting — that's handled by CDP pipeline)
          CODE=$(call -X POST "$BOT_URL/api/services/horoscope/publish?account_slug=ai-horoscope" \
            -H "Content-Type: application/json")
          echo "Save to DB -> HTTP $CODE"
          echo "body: $(head -c 500 /tmp/body.txt)"
          [ "$CODE" = "200" ] || echo "::warning::Bot Manager DB save failed (HTTP $CODE)"

      - name: Trigger tweet via Bot Manager pipeline
        env:
          BOT_URL: ${{ secrets.BOT_MANAGER_URL }}
          BOT_API_KEY: ${{ secrets.BOT_MANAGER_API_KEY }}
        run: |
          call() {
            : > /tmp/body.txt   # curl leaves it untouched when it cannot connect
            curl -sS -m 20 -o /tmp/body.txt -w '%{http_code}' \
              -H "X-API-Key: $BOT_API_KEY" "$@" 2>/tmp/curl.err || true
          }

          # Trigger the horoscope pipeline which posts via CDP
          CODE=$(call -X POST "$BOT_URL/api/jobs/ai-horoscope_horoscope_pipeline/trigger")
          echo "Pipeline trigger -> HTTP $CODE"
          echo "body: $(head -c 500 /tmp/body.txt)"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Pipeline trigger failed (HTTP $CODE) — no tweet will be posted"
            echo "curl: $(cat /tmp/curl.err)"
            exit 0
          fi

          # Wait for tweet to be posted
          sleep 30

          # Check if tweet was posted by querying the latest horoscope
          CODE=$(call "$BOT_URL/api/services/horoscope/today")
          echo "horoscope/today -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::Could not read back today's horoscope (HTTP $CODE)"
            exit 0
          fi
          TWEET_ID=$(python3 -c "
          import json
          try:
              print(json.load(open('/tmp/body.txt')).get('tweet_id') or '')
          except Exception:
              print('')
          ")

          if [ -n "$TWEET_ID" ]; then
            echo "Tweet posted: $TWEET_ID"
            TWEET_ID="$TWEET_ID" python3 -c "
          import json, os
          tid = os.environ['TWEET_ID']
          data = json.load(open('data/latest.json'))
          data['tweet_id'] = tid
          data['tweet_url'] = f'https://x.com/dev_horoscope/status/{tid}'
          json.dump(data, open('data/latest.json', 'w'), ensure_ascii=False, indent=2)
          "
          else
            echo "::warning::Tweet not posted — Chrome CDP may not be running"
          fi
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "🔮 $(date +%Y-%m-%d) horoscope"
          git push origin main

      - name: Deploy to GitHub Pages
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          # Setup SSH key for GitHub push
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/github_deploy
          chmod 600 ~/.ssh/github_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          # Configure git to use the deploy key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy -o StrictHostKeyChecking=no"

          # Push to GitHub (triggers Pages rebuild)
          git remote add github git@github.com:jiunbae/ai-horoscope.git 2>/dev/null || \
          git remote set-url github git@github.com:jiunbae/ai-horoscope.git
          git push github main --force

          # Cleanup
          rm -f ~/.ssh/github_deploy
        continue-on-error: true
